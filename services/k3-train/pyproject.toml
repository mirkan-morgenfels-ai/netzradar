[project]
name = "k3-train"
version = "0.1.0"
description = "NetzRadar: Datenaufbereitung, Baseline und Export fuer die Anomalie-Erkennung in Transaktionsnetzwerken"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Mirkan Deniz Günkaya" }]
dependencies = [
    "networkx>=3.5,<4",
    "numpy>=2.2,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.6,<2",
]

[project.scripts]
k3-train = "k3_train.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "k3_train"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "NPY", "RUF", "ERA", "PIE", "RET"]

[tool.ruff.lint.isort]
known-first-party = ["k3_train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
